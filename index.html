<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ivan Lopez Pedreañez - PWA Portfolio" />
    <title>Ivan Lopez Pedreañez | Web App</title>

    <link rel="icon" href="imgx/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/manifest.json" />

    <!-- CDN Estilos Base -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" /> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nova+Square|Roboto|Raleway|Satisfy|Lobster&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <main id="app-content">
        <!-- Contenedores de cada sección -->
        <section id="sec-bio" class="app-section active"></section>
        <section id="sec-translator" class="app-section"></section>
        <section id="sec-programmer" class="app-section"></section>
        <section id="sec-math" class="app-section"></section>
        <section id="sec-educator" class="app-section"></section>
    </main>

    <!-- Navegación estilo App (Bottom Bar) -->
    <nav class="app-nav">
        <button data-target="sec-bio" class="nav-btn active">
            <i class="fa fa-user"></i> <span>Perfil</span>
        </button>
        <button data-target="sec-programmer" class="nav-btn">
            <i class="fa fa-code"></i> <span>Dev</span>
        </button>
        <button data-target="sec-math" class="nav-btn">
            <i class="fa fa-calculator"></i> <span>Matemática</span>
        </button>
        <button data-target="sec-translator" class="nav-btn">
            <i class="fa fa-language"></i> <span>Idiomas</span>
        </button>
        <button data-target="sec-educator" class="nav-btn">
            <i class="fa fa-graduation-cap"></i> <span>Educación</span>
        </button>
    </nav>

    <!-- Scripts de la App -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    
    <!-- Carga del orquestador principal (módulos ES6) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
