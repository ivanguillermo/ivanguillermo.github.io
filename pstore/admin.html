<script>
    // === CONFIGURACIÓN ===
    const ADMIN_EMAIL = "ivanglopezp@gmail.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCCOFnNPRXeWEpAOFtBpAkthyrBC5-2Erl_RTDdxHYxrXCDnQuube2oRsgQuCFRdnCcg/exec";

    // Decodificador JWT
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) {
        return null;
      }
    }

    // Manejo de la respuesta de Google
    async function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      if (!payload || !payload.email) return;

      const correoUsuario = payload.email.toLowerCase();
      const errDiv = document.getElementById("loginError");

      try {
        // Se agrega ?t=... para saltar la caché del navegador y leer la hoja en vivo
        const res = await fetch(`${SCRIPT_URL}?t=${new Date().getTime()}`);
        const data = await res.json();
        
        const listaPermitida = (data.usuarios || []).map(u => String(u).toLowerCase());
        const listaVentas = data.ventas || (Array.isArray(data) ? data : []);

        if (listaPermitida.includes(correoUsuario) || correoUsuario === ADMIN_EMAIL.toLowerCase()) {
          sessionStorage.setItem("user_authenticated", "true");
          sessionStorage.setItem("user_email", correoUsuario);
          
          mostrarDashboard();
          renderizarVentas(listaVentas);
        } else {
          errDiv.innerText = `⛔ Acceso denegado: El correo ${correoUsuario} no está autorizado.`;
          errDiv.style.display = "block";
        }
      } catch (err) {
        console.error("Error al validar usuario:", err);
        errDiv.innerText = "Error de conexión al verificar permisos o cargar datos.";
        errDiv.style.display = "block";
      }
    }

    function mostrarDashboard() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboardContent").style.display = "block";
    }

    function cerrarSesion() {
      sessionStorage.clear();
      window.location.reload();
    }

    window.onload = function() {
      if (sessionStorage.getItem("user_authenticated") === "true") {
        mostrarDashboard();
        cargarVentas();
      }
    };

    async function cargarVentas() {
      try {
        // Se agrega ?t=... para saltar la caché del navegador
        const res = await fetch(`${SCRIPT_URL}?t=${new Date().getTime()}`);
        const data = await res.json();
        const listaVentas = data.ventas || (Array.isArray(data) ? data : []);
        renderizarVentas(listaVentas);
      } catch (err) {
        console.error("Error al cargar ventas:", err);
        document.getElementById('tablaCuerpo').innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Error al cargar las ventas.</td></tr>`;
      }
    }

    function renderizarVentas(ventas) {
      let acumuladoMonto = 0;
      let cantidadPedidos = ventas.length;
      let htmlTabla = "";

      if (cantidadPedidos === 0) {
        document.getElementById('tablaCuerpo').innerHTML = `<tr><td colspan="4" style="text-align:center;">No hay registro de ventas aún.</td></tr>`;
        document.getElementById('totalMonto').innerText = "$0.00";
        document.getElementById('totalPedidos').innerText = "0";
        document.getElementById('ticketPromedio').innerText = "$0.00";
        return;
      }

      [...ventas].reverse().forEach(v => {
        const fecha = v.marca_temporal || v.fecha || "N/A";
        const cliente = v.nombre || v.cliente || v.telefono || "Cliente";
        const productos = v.productos || v.detalle || v.producto || "Pedido";
        
        let monto = parseFloat(v.total || v.monto || v.precio || 0);
        if (isNaN(monto)) monto = 0;

        acumuladoMonto += monto;

        htmlTabla += `
          <tr>
            <td>${new Date(fecha).toLocaleDateString() !== 'Invalid Date' ? new Date(fecha).toLocaleDateString() : fecha}</td>
            <td><strong>${cliente}</strong></td>
            <td>${productos}</td>
            <td><strong>$${monto.toFixed(2)}</strong></td>
          </tr>
        `;
      });

      document.getElementById('totalMonto').innerText = `$${acumuladoMonto.toFixed(2)}`;
      document.getElementById('totalPedidos').innerText = cantidadPedidos;
      document.getElementById('ticketPromedio').innerText = `$${(cantidadPedidos > 0 ? acumuladoMonto / cantidadPedidos : 0).toFixed(2)}`;
      document.getElementById('tablaCuerpo').innerHTML = htmlTabla;
    }
  </script>
