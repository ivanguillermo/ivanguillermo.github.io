<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Ventas | Pstore</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    h1 { margin: 0; font-size: 24px; color: #111; }
    
    /* Tarjetas KPI */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 28px; font-weight: bold; color: #111; }
    .card .value.green { color: #10b981; }
    
    /* Tabla de Pedidos */
    .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #edf2f7; font-size: 14px; }
    th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
    tr:hover { background-color: #f8fafc; }
    
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .badge.completado { background-color: #d1fae5; color: #065f46; }
    .badge.pendiente { background-color: #fef3c7; color: #92400e; }
    
    .btn-refresh { background-color: #000; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-refresh:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 Dashboard de Ventas - Pstore</h1>
    <button class="btn-refresh" onclick="cargarVentas()">🔄 Actualizar</button>
  </div>

  <!-- Métricas Generales -->
  <div class="kpi-grid">
    <div class="card">
      <h3>Ventas Totales</h3>
      <div class="value green" id="totalMonto">$0.00</div>
    </div>
    <div class="card">
      <h3>Pedidos Realizados</h3>
      <div class="value" id="totalPedidos">0</div>
    </div>
    <div class="card">
      <h3>Ticket Promedio</h3>
      <div class="value" id="ticketPromedio">$0.00</div>
    </div>
  </div>

  <!-- Tabla de Ventas -->
  <div class="table-container">
    <h3>Últimos Pedidos</h3>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Cliente / Contacto</th>
          <th>Detalle de Productos</th>
          <th>Monto Total</th>
        </tr>
      </thead>
      <tbody id="tablaCuerpo">
        <tr>
          <td colspan="4" style="text-align: center; color: #888;">Cargando datos de ventas...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCCOFnNPRXeWEpAOFtBpAkthyrBC5-2Erl_RTDdxHYxrXCDnQuube2oRsgQuCFRdnCcg/exec";

    async function cargarVentas() {
      try {
        const res = await fetch(SCRIPT_URL);
        const ventas = await res.json();

        let acumuladoMonto = 0;
        let cantidadPedidos = ventas.length;
        let htmlTabla = "";

        if (cantidadPedidos === 0) {
          document.getElementById('tablaCuerpo').innerHTML = `<tr><td colspan="4" style="text-align:center;">No hay registro de ventas aún.</td></tr>`;
          return;
        }

        ventas.reverse().forEach(v => {
          // Extraer campos (ajusta los nombres según los encabezados de tu hoja)
          const fecha = v.marca_temporal || v.fecha || "N/A";
          const cliente = v.nombre || v.cliente || v.telefono || "Cliente";
          const productos = v.productos || v.detalle || v.producto || "Pedido";
          
          let monto = parseFloat(v.total || v.monto || v.precio || 0);
          if (isNaN(monto)) monto = 0;

          acumuladoMonto += monto;

          htmlTabla += `
            <tr>
              <td>${new Date(fecha).toLocaleDateString() !== 'Invalid Date' ? new Date(fecha).toLocaleDateString() : fecha}</td>
              <td><strong>${cliente}</strong></td>
              <td>${productos}</td>
              <td><strong>$${monto.toFixed(2)}</strong></td>
            </tr>
          `;
        });

        // Actualizar KPIs
        document.getElementById('totalMonto').innerText = `$${acumuladoMonto.toFixed(2)}`;
        document.getElementById('totalPedidos').innerText = cantidadPedidos;
        document.getElementById('ticketPromedio').innerText = `$${(cantidadPedidos > 0 ? acumuladoMonto / cantidadPedidos : 0).toFixed(2)}`;

        // Renderizar Tabla
        document.getElementById('tablaCuerpo').innerHTML = htmlTabla;

      } catch (err) {
        console.error("Error al cargar ventas:", err);
        document.getElementById('tablaCuerpo').innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Error al cargar las ventas. Revisa la consola.</td></tr>`;
      }
    }

    // Cargar al entrar
    cargarVentas();
  </script>
</body>
</html>
