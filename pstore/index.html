<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pstore | Catálogo Online</title>
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="pstore.css">

  <!-- Librería PapaParse para leer archivos CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <header>
    <div class="header-container">
      <!-- Branding / Logo con Imagen -->
      <a href="#" class="brand">
        <img src="assets/pstore_logo.png" alt="Pstore Logo" class="brand-logo-img">
        <div class="brand-title">P<span>store</span></div>
      </a>

      <!-- Navegación básica -->
      <nav class="nav-links">
        <a href="#catalogo">Catálogo</a>
        <a href="#contacto">Contacto</a>
      </nav>

      <!-- Selector por Categoría -->
      <div class="filter-container">
        <label for="select-categoria" class="filter-label">Categoría:</label>
        <select id="select-categoria" class="select-category">
          <option value="todas">Todas las categorías</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <div id="catalogo" class="catalogo">
      <!-- Tarjetas insertadas mediante JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      
      <!-- Columna 1: Info Marca -->
      <div class="footer-col">
        <h3>Pstore</h3>
        <p>Tu tienda en línea con el catálogo de productos más actualizado. Calidad y variedad al mejor precio.</p>
      </div>

      <!-- Columna 2: Búsquedas Rápida -->
      <div class="footer-col">
        <h3>Búsqueda Rápida</h3>
        <ul id="footer-categorias">
          <li><a data-cat="todas">Ver todo el catálogo</a></li>
        </ul>
      </div>

      <!-- Columna 3: Navegación -->
      <div class="footer-col">
        <h3>Navegación</h3>
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#contacto">Contacto y Soporte</a></li>
          <li><a href="#">Términos y Condiciones</a></li>
        </ul>
      </div>

    </div>

    <div class="footer-bottom">
      <p>&copy; 2026 Pstore. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Lógica JavaScript -->
  <script src="pstore.js"></script>
</body>
</html>
