<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
  
  <!-- CSS básico para maquetar el catálogo en cuadrícula (Grid) -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #f4f4f9; padding: 2rem; color: #333; }
    
    header { text-align: center; margin-bottom: 2rem; }
    
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tarjeta {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .tarjeta:hover { transform: translateY(-4px); }
    .tarjeta img { width: 100%; height: 200px; object-fit: cover; }
    .contenido { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; }
    .categoria { font-size: 0.8rem; color: #888; text-transform: uppercase; font-weight: bold; }
    .nombre { font-size: 1.1rem; margin: 0.3rem 0; }
    .descripcion { font-size: 0.9rem; color: #666; margin-bottom: 1rem; flex-grow: 1; }
    .precio { font-size: 1.25rem; font-weight: bold; color: #2a7a4c; }
  </style>

  <!-- Librería PapaParse para leer archivos CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <header>
    <h1>Catálogo de Productos</h1>
  </header>

  <main id="catalogo" class="catalogo">
    <!-- Aquí JavaScript insertará las tarjetas automáticamente -->
  </main>

  <script>
    // 1. Cargar el archivo CSV local
    Papa.parse("pstore.csv", {
      download: true,
      header: true, // Interpreta la primera fila como nombres de columna
      skipEmptyLines: true,
      complete: function(results) {
        renderizarCatalogo(results.data);
      },
      error: function(err) {
        console.error("Error al leer el archivo CSV:", err);
      }
    });

    // 2. Dibujar las tarjetas en el HTML
    function renderizarCatalogo(productos) {
      const contenedor = document.getElementById("catalogo");
      
      productos.forEach(prod => {
        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";

        tarjeta.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">
          <div class="contenido">
            <span class="categoria">${prod.categoria}</span>
            <h2 class="nombre">${prod.nombre}</h2>
            <p class="descripcion">${prod.descripcion}</p>
            <span class="precio">$${parseFloat(prod.precio).toFixed(2)}</span>
          </div>
        `;

        contenedor.appendChild(tarjeta);
      });
    }
  </script>
</body>
</html>
